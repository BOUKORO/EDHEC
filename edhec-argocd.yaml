apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edhec
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/BOUKORO/EDHEC.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: edhec

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
